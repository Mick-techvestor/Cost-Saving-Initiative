<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techvestor · Initiative Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--bg2:#13161b;--bg3:#1a1e25;--bg4:#222730;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f2f5;--text2:#8b92a0;--text3:#4a5160;--accent:#4f9cf9;--accent2:#3b82f6;--green:#34d399;--green-bg:rgba(52,211,153,0.12);--red:#f87171;--red-bg:rgba(248,113,113,0.12);--amber:#fbbf24;--amber-bg:rgba(251,191,36,0.12);--purple:#a78bfa;--teal:#2dd4bf;--coral:#fb923c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{width:34px;height:34px;background:var(--accent2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
.topbar-brand{display:flex;align-items:center;gap:11px;}
.topbar-title{font-size:15px;font-weight:600;color:var(--text);}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.data-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.main{padding:28px;max-width:1440px;margin:0 auto;}
.breadcrumb{display:flex;align-items:center;gap:7px;margin-bottom:22px;font-size:12px;}
.crumb{color:var(--text3);cursor:pointer;transition:color 0.15s;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:12px;padding:0;}
.crumb:hover{color:var(--accent);}
.sep{color:var(--text3);}
.crumb-active{color:var(--text2);}

/* HOME */
.home-top{margin-bottom:32px;}
.home-top h2{font-size:26px;font-weight:600;color:var(--text);margin-bottom:5px;}
.home-top p{font-size:14px;color:var(--text2);}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:36px;}
.sum-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:18px 20px;}
.sum-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:8px;}
.sum-val{font-size:28px;font-weight:600;color:var(--text);line-height:1;font-family:'DM Mono',monospace;}
.sum-sub{font-size:12px;color:var(--text2);margin-top:5px;}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:16px;}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}

/* GROUP CARD */
.gcard{background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:22px 24px;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;}
.gcard:hover{border-color:var(--border2);transform:translateY(-2px);background:var(--bg3);}
.gcard-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:15px 15px 0 0;}
.gcard-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.gcard-icon{font-size:26px;line-height:1;}
.gcard-summary-pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;}
.pill-good{background:var(--green-bg);color:var(--green);}
.pill-warn{background:var(--red-bg);color:var(--red);}
.pill-mixed{background:var(--amber-bg);color:var(--amber);}
.gcard-name{font-size:17px;font-weight:600;color:var(--text);margin-bottom:14px;}
.gcard-spend{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);margin-bottom:4px;}
.gcard-props{font-size:11px;color:var(--text3);margin-bottom:14px;}

/* INITIATIVE BREAKDOWN ROWS */
.init-breakdown{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:7px;}
.init-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.init-row-name{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.init-row-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.init-row-spend{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);}
.init-trend{font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px;white-space:nowrap;}
.init-trend.up{background:var(--red-bg);color:var(--red);}
.init-trend.down{background:var(--green-bg);color:var(--green);}
.init-trend.flat{background:var(--bg4);color:var(--text3);}

/* GROUP VIEW */
.view-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.view-header-left h2{font-size:23px;font-weight:600;color:var(--text);}
.view-header-left p{font-size:13px;color:var(--text2);margin-top:4px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.fselect{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:8px 13px;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;transition:border-color 0.15s;}
.fselect:focus{border-color:var(--accent);}
.fselect option{background:var(--bg3);}
.init-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.itab{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.itab:hover{border-color:var(--border2);color:var(--text);}
.itab.active{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:500;}

/* METRICS */
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px;}
.mcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:15px 17px;}
.mcard-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:7px;}
.mcard-val{font-size:25px;font-weight:600;color:var(--text);line-height:1;font-family:'DM Mono',monospace;}
.mcard-sub{font-size:11px;color:var(--text2);margin-top:5px;}
.mcard-val.red{color:var(--red);}
.mcard-val.grn{color:var(--green);}

/* AI PANEL */
.ai-panel{background:var(--bg2);border:1px solid var(--border2);border-radius:15px;padding:22px 24px;margin-bottom:20px;position:relative;overflow:hidden;}
.ai-panel::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent2),var(--purple),var(--teal));}
.ai-top{display:flex;align-items:center;gap:10px;}
.ai-badge{background:linear-gradient(135deg,var(--accent2),var(--purple));color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0;}
.ai-title{font-size:15px;font-weight:600;color:var(--text);flex:1;}
.ai-btn{background:var(--accent2);color:#fff;border:none;padding:9px 20px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.ai-btn:hover{background:#2563eb;}
.ai-btn:disabled{opacity:0.55;cursor:default;}
.ai-body{margin-top:16px;}
.ai-placeholder{color:var(--text3);font-size:13px;font-style:italic;padding:4px 0;}
.ai-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
.ai-card{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:16px 18px;}
.ai-card.good{border-color:rgba(52,211,153,0.22);}
.ai-card.warn{border-color:rgba(251,191,36,0.22);}
.ai-card.info{border-color:rgba(79,156,249,0.18);}
.ai-card-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.ai-cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ai-cdot.good{background:var(--green);}
.ai-cdot.warn{background:var(--amber);}
.ai-cdot.info{background:var(--accent);}
.ai-ctype{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.ai-ctype.good{color:var(--green);}
.ai-ctype.warn{color:var(--amber);}
.ai-ctype.info{color:var(--accent);}
.ai-ctext{font-size:13px;color:var(--text2);line-height:1.65;}
.ai-loading{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;padding:4px 0;}
.spinner{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABLE */
.tsection{background:var(--bg2);border:1px solid var(--border);border-radius:15px;overflow:hidden;}
.thead-bar{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.thead-title{font-size:13px;font-weight:500;color:var(--text2);}
.tlegend{display:flex;gap:16px;font-size:11px;color:var(--text3);}
.tleg{display:flex;align-items:center;gap:5px;}
.tleg-dot{width:8px;height:8px;border-radius:2px;}
.twrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:var(--bg3);font-size:10px;font-weight:600;color:var(--text3);padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.05em;user-select:none;}
th:first-child{text-align:left;min-width:155px;position:sticky;left:0;background:var(--bg3);z-index:2;}
th.sortable{cursor:pointer;transition:color 0.15s;}
th.sortable:hover{color:var(--accent);}
th.sort-asc,th.sort-desc{color:var(--accent) !important;}
th.sort-asc::after{content:' ↑';}
th.sort-desc::after{content:' ↓';}
th.ynew{border-left:2px solid rgba(79,156,249,0.25);}
td{padding:7px 10px;text-align:right;border-top:1px solid var(--border);color:var(--text);white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px;}
td:first-child{text-align:left;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;position:sticky;left:0;background:var(--bg2);z-index:1;color:var(--text);}
tr:hover td{background:var(--bg3) !important;}
td.ynew{border-left:2px solid rgba(79,156,249,0.15);}
td.hi{color:var(--red) !important;}
td.lo{color:var(--green) !important;}
td.mt{color:var(--text3);}
.trow-total td{background:var(--bg3) !important;font-weight:600;border-top:1px solid var(--border2);color:var(--text) !important;}
.trow-total td:first-child{font-family:'DM Sans',sans-serif;}
.no-data{padding:48px;text-align:center;color:var(--text3);font-size:14px;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein 0.22s ease forwards;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
</style>
</head>

// IMPROVED TREND: compare most recent month vs prior 3-month average
function calcTrend(d) {
  if(!d||!d.months||d.months.length < 2) return {pct:0, recentMonthTotal:0, priorAvg:0};
  const mt={};
  for(const m of d.months) mt[m]=d.properties.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);
  const lastMonth = d.months[d.months.length-1];
  const priorMonths = d.months.slice(-4,-1); // 3 months before last
  const recentMonthTotal = mt[lastMonth]||0;
  const priorAvg = priorMonths.length ? priorMonths.reduce((s,m)=>s+(mt[m]||0),0)/priorMonths.length : 0;
  const pct = priorAvg ? ((recentMonthTotal - priorAvg) / priorAvg) * 100 : 0;
  return {pct, recentMonthTotal, priorAvg, lastMonth};
}

function calcM(d){
  const mt={};let grand=0;
  for(const m of d.months){mt[m]=d.properties.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);grand+=mt[m];}
  const rec=d.months.slice(-3),pri=d.months.slice(-6,-3);
  const recT=rec.reduce((s,m)=>s+(mt[m]||0),0),priT=pri.reduce((s,m)=>s+(mt[m]||0),0);
  const pct=priT?((recT-priT)/priT)*100:0;
  // Also compute last-month vs prior-3-avg trend
  const trend = calcTrend(d);
  return{grand,mt,avg:grand/(d.months.length||1),recT,priT,pct,rec,trendPct:trend.pct,lastMonth:trend.lastMonth};
}

function getD(initName,market,year){
  const d=DATA[initName];if(!d)return{months:[],properties:[],data:{},markets:[]};
  let months=d.months;
  if(year)months=months.filter(m=>m.startsWith(year));
  const props=d.properties;
  const data={};
  for(const p of props)for(const m of months){const k=p+'|'+m;if(d.data[k])data[k]=d.data[k];}
  return{months,properties:props,data,markets:d.markets||[]};
}

function sortedProps(properties,data,months){
  const list=[...properties];
  if(sortState.col==='name'){list.sort((a,b)=>sortState.dir==='asc'?a.localeCompare(b):b.localeCompare(a));}
  else if(sortState.col==='total'){list.sort((a,b)=>{const ta=months.reduce((s,m)=>s+(data[a+'|'+m]||0),0);const tb=months.reduce((s,m)=>s+(data[b+'|'+m]||0),0);return sortState.dir==='asc'?ta-tb:tb-ta;});}
  else{list.sort((a,b)=>{const va=data[a+'|'+sortState.col]||0;const vb=data[b+'|'+sortState.col]||0;return sortState.dir==='asc'?va-vb:vb-va;});}
  return list;
}

}

function renderGroup(gid,initName,market,year){
  const g=GROUPS.find(x=>x.id===gid);if(!g)return;
  const activeInit=initName||g.inits[0];
  const selMkt=(market===undefined||market===null)?'all':market;
  const selYr=(year===undefined||year===null)?'':year;
  currentView={gid,init:activeInit,market:selMkt,year:selYr};
  const d=DATA[activeInit]||{months:[],properties:[],markets:[],data:{}};
  const allYears=[...new Set(d.months.map(m=>m.split('-')[0]))].sort();
  const fd=getD(activeInit,selMkt,selYr);
  const m=calcM(fd);
  const cacheKey=activeInit+'|'+selMkt+'|'+selYr;
  const ai=aiCache[cacheKey]||{};
  const allVals=fd.properties.flatMap(p=>fd.months.map(mo=>(fd.data[p+'|'+mo]||0))).filter(v=>v>0).sort((a,b)=>a-b);
  const p75=allVals[Math.floor(allVals.length*0.75)]||Infinity;
  const p25=allVals[Math.floor(allVals.length*0.25)]||0;
  const mkts=[...new Set(d.markets)].sort();
  const orderedProps=sortedProps(fd.properties,fd.data,fd.months);

  // Use improved trend for metric card
  const trendPct = m.trendPct;
  const trendLabel = `${trendPct>=0?'+':''}${trendPct.toFixed(1)}%`;
  const trendClass = trendPct > 10 ? 'red' : trendPct < -5 ? 'grn' : '';
  const trendSub = `vs prior 3-mo avg${m.lastMonth?' ('+mlabel(m.lastMonth)+')':''}`;

  let h=`<div class="fadein">
    <div class="breadcrumb"><button class="crumb" onclick="renderHome()">Dashboard</button><span class="sep">›</span><span class="crumb-active">${g.name}</span></div>
    <div class="view-header">
      <div class="view-header-left"><h2>${g.icon} ${g.name}</h2><p>${g.inits.length} initiatives tracked · ${mkts.slice(0,3).join(', ')}${mkts.length>3?' + more':''}</p></div>
      <div class="filters">
        <select class="fselect" onchange="renderGroup('${gid}','${activeInit}',this.value,'${selYr}')">
          <option value="all" ${selMkt==='all'?'selected':''}>All markets</option>
          ${mkts.map(mk=>`<option value="${mk}" ${selMkt===mk?'selected':''}>${mk}</option>`).join('')}
        </select>
        <select class="fselect" onchange="renderGroup('${gid}','${activeInit}','${selMkt}',this.value)">
          <option value="" ${!selYr?'selected':''}>All years</option>
          ${allYears.map(y=>`<option value="${y}" ${selYr===y?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="init-tabs">${g.inits.map(i=>`<button class="itab ${i===activeInit?'active':''}" onclick="renderGroup('${gid}','${i}','${selMkt}','${selYr}')">${i.replace(/_/g,' ')}</button>`).join('')}</div>
    <div class="metrics-row">
      <div class="mcard"><div class="mcard-label">Total Spend</div><div class="mcard-val">${fmt(m.grand)}</div><div class="mcard-sub">${fd.months.length} months</div></div>
      <div class="mcard"><div class="mcard-label">Properties</div><div class="mcard-val">${fd.properties.length}</div><div class="mcard-sub">tracked</div></div>
      <div class="mcard"><div class="mcard-label">Monthly Avg</div><div class="mcard-val">${fmt(m.avg)}</div><div class="mcard-sub">per month</div></div>
      <div class="mcard"><div class="mcard-label">Latest Month Trend</div><div class="mcard-val ${trendClass}">${trendLabel}</div><div class="mcard-sub">${trendSub}</div></div>
      <div class="mcard"><div class="mcard-label">Last Month</div><div class="mcard-val">${fmt(m.mt[fd.months[fd.months.length-1]]||0)}</div><div class="mcard-sub">${fd.months.length?mlabel(fd.months[fd.months.length-1]):'-'}</div></div>
    </div>
    <div class="ai-panel">
      <div class="ai-top">
        <span class="ai-badge">AI Analysis</span>
        <span class="ai-title">${activeInit.replace(/_/g,' ')} — Spending Insights</span>
        <button class="ai-btn" onclick="runAI('${gid}','${activeInit}','${selMkt}','${selYr}')" ${ai.loading?'disabled':''}>
          ${ai.loading?'<span class="spinner"></span> Analyzing...':ai.insights?'↻ Re-analyze':'✦ Analyze Initiative'}
        </button>
      </div>
      <div class="ai-body">
        ${ai.loading?`<div class="ai-loading"><div class="spinner"></div>Analyzing ${fd.properties.length} properties...</div>`
          :ai.insights?renderInsights(ai.insights)
          :ai.error?`<div style="color:var(--red);font-size:13px">${ai.error}</div>`
          :'<div class="ai-placeholder">Click "Analyze Initiative" for AI-powered insights on spend trends, outliers, and savings opportunities.</div>'}
      </div>
    </div>`;

  if(!fd.months.length||!fd.properties.length){
    h+=`<div class="tsection"><div class="no-data">No data found for this initiative with the current filters.</div></div>`;
  } else {
    h+=`<div class="tsection"><div class="thead-bar"><span class="thead-title">${fd.properties.length} properties · ${fd.months.length} months · click headers to sort</span><div class="tlegend"><div class="tleg"><div class="tleg-dot" style="background:var(--red)"></div>Top 25%</div><div class="tleg"><div class="tleg-dot" style="background:var(--green)"></div>Bottom 25%</div></div></div>
    <div class="twrap"><table><thead><tr>
    <th class="sortable ${sortState.col==='name'?'sort-'+sortState.dir:''}" onclick="setSort('name')">Property</th>`;
    let py=null;
    for(const mo of fd.months){const y=mo.split('-')[0];const ny=y!==py;const is=sortState.col===mo;h+=`<th class="sortable${ny?' ynew':''}${is?' sort-'+sortState.dir:''}" onclick="setSort('${mo}')">${ny?y+' ':''}${mlabel(mo)}</th>`;py=y;}
    h+=`<th class="sortable ${sortState.col==='total'?'sort-'+sortState.dir:''}" onclick="setSort('total')">Total</th></tr></thead><tbody>`;
    for(const prop of orderedProps){
      const rt=fd.months.reduce((s,mo)=>s+(fd.data[prop+'|'+mo]||0),0);
      h+=`<tr><td>${prop}</td>`;
      let py2=null;
      for(const mo of fd.months){const v=fd.data[prop+'|'+mo]||0;const y=mo.split('-')[0];const ny=y!==py2;const cls=v>=p75&&v>0?'hi':v>0&&v<=p25?'lo':v===0?'mt':'';h+=`<td class="${cls}${ny?' ynew':''}">${v>0?fmtF(v):'—'}</td>`;py2=y;}
      h+=`<td>${fmtF(rt)}</td></tr>`;
    }
    h+=`<tr class="trow-total"><td>Total</td>`;
    let py3=null;
    for(const mo of fd.months){const y=mo.split('-')[0];const ny=y!==py3;h+=`<td class="${ny?'ynew':''}">${fmtF(m.mt[mo]||0)}</td>`;py3=y;}
    h+=`<td>${fmtF(m.grand)}</td></tr></tbody></table></div></div>`;
  }
  h+=`</div>`;
  $('main').innerHTML=h;
  window.scrollTo(0,0);
}

function renderInsights(ins){
  const tl={good:'On Track',warn:'Needs Attention',info:'Insight'};
  return`<div class="ai-cards">${ins.map(i=>`<div class="ai-card ${i.type}"><div class="ai-card-head"><div class="ai-cdot ${i.type}"></div><span class="ai-ctype ${i.type}">${tl[i.type]||i.type}</span></div><div class="ai-ctext">${i.text}</div></div>`).join('')}</div>`;
}

async function runAI(gid,initName,selMkt,selYr){
  const key=initName+'|'+selMkt+'|'+selYr;
  aiCache[key]={loading:true};
  renderGroup(gid,initName,selMkt,selYr);
  const fd=getD(initName,selMkt,selYr);
  const m=calcM(fd);
  const pt={};
  for(const p of fd.properties)pt[p]=fd.months.reduce((s,mo)=>s+(fd.data[p+'|'+mo]||0),0);
  const sorted=Object.entries(pt).sort((a,b)=>b[1]-a[1]);
  const trendStr=m.rec.map(mo=>mlabel(mo)+': '+fmtF(m.mt[mo]||0)).join(', ');
  const prompt=`You are a financial analyst for Techvestor, a short-term rental property management company. Analyze the "${initName.replace(/_/g,' ')}" cost initiative.

Summary:
- Total spend: ${fmtF(m.grand)} over ${fd.months.length} months
- Properties: ${fd.properties.length}${selMkt!=='all'?' in '+selMkt:' across all markets'}
- Monthly avg: ${fmtF(m.avg)}
- Latest month vs prior 3-month avg: ${m.trendPct>=0?'+':''}${m.trendPct.toFixed(1)}% (${m.lastMonth?mlabel(m.lastMonth):''})
- Highest cost properties: ${sorted.slice(0,3).map(([p,v])=>p+' ('+fmtF(v)+')').join(', ')}
- Lowest cost properties: ${sorted.slice(-3).map(([p,v])=>p+' ('+fmtF(v)+')').join(', ')}
- Recent trend: ${trendStr}

Provide 3 sharp specific insights for the ops team. Use real $ and % from the data. Be direct and actionable.
Return ONLY valid JSON: {"insights":[{"type":"good","text":"..."},{"type":"warn","text":"..."},{"type":"info","text":"..."}]}`;

  try{
    const r=await fetch(PROXY_URL+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    if(!r.ok)throw new Error('Server returned '+r.status);
    const data=await r.json();
    const text=data.content?.[0]?.text||'';
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    aiCache[key]={insights:parsed.insights};
  }catch(e){
    aiCache[key]={error:'Analysis unavailable — '+e.message};
  }
  renderGroup(gid,initName,selMkt,selYr);
}

renderHome();
</script>
