<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Techvestor · Initiative Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--bg2:#13161b;--bg3:#1a1e25;--bg4:#222730;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f2f5;--text2:#8b92a0;--text3:#4a5160;--accent:#4f9cf9;--accent2:#3b82f6;--green:#34d399;--gbg:rgba(52,211,153,0.12);--red:#f87171;--rbg:rgba(248,113,113,0.12);--amber:#fbbf24;--abg:rgba(251,191,36,0.12);--purple:#a78bfa;--teal:#2dd4bf;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{width:32px;height:32px;background:var(--accent2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-title{font-size:15px;font-weight:600;}
.brand-sub{font-size:11px;color:var(--text3);}
.pill{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}
.pill-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.fbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:46px;}
.fbar-right{display:flex;align-items:center;gap:8px;}
.mkt-sel{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;height:28px;}
.mkt-sel:focus{border-color:var(--accent);}
.mkt-sel option{background:var(--bg3);}
.fbar-left{display:flex;}
.ntab{padding:0 18px;height:46px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.ntab:hover{color:var(--text2);}
.ntab.active{color:var(--accent);border-bottom-color:var(--accent);}
.fbtns{display:flex;gap:4px;}
.fbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text3);padding:4px 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.fbtn:hover{border-color:var(--border2);color:var(--text2);}
.fbtn.active{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.main{padding:28px;max-width:1440px;margin:0 auto;}
/* HOME */
.page-title{font-size:26px;font-weight:600;margin-bottom:4px;}
.page-sub{font-size:14px;color:var(--text2);margin-bottom:28px;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:32px;}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:16px 18px;}
.scard-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:7px;}
.scard-val{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);line-height:1;}
.scard-sub{font-size:11px;color:var(--text2);margin-top:4px;}
.scard-sub2{font-size:10px;color:var(--text3);margin-top:3px;}
.glabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:14px;}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:14px;}
/* GROUP CARDS */
.gcard{background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:20px 22px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;}
.gcard:hover{border-color:var(--border2);transform:translateY(-2px);background:var(--bg3);}
.gcard-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:15px 15px 0 0;}
.gcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.gcard-icon{font-size:22px;}
.gpill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
.gpill-g{background:var(--gbg);color:var(--green);}
.gpill-r{background:var(--rbg);color:var(--red);}
.gpill-a{background:var(--abg);color:var(--amber);}
.gcard-name{font-size:16px;font-weight:600;margin-bottom:9px;}
.gcard-mrow{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;}
.gcard-spend{font-size:25px;font-weight:600;font-family:'DM Mono',monospace;}
.gtrend{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;}
.gtrend-u{background:var(--rbg);color:var(--red);}
.gtrend-d{background:var(--gbg);color:var(--green);}
.gtrend-f{background:var(--bg4);color:var(--text3);}
.gcard-meta{font-size:11px;color:var(--text3);margin-bottom:3px;}
.gcard-at{font-size:10px;color:var(--text3);margin-bottom:11px;}
.ilist{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:6px;}
.irow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.irow-n{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.irow-r{display:flex;align-items:center;gap:6px;}
.irow-v{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);}
.itrend{font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px;white-space:nowrap;}
.itrend-u{background:var(--rbg);color:var(--red);}
.itrend-d{background:var(--gbg);color:var(--green);}
.itrend-f{background:var(--bg4);color:var(--text3);}
/* DETAIL VIEW */
.bc{display:flex;align-items:center;gap:7px;margin-bottom:20px;font-size:12px;}
.bc-link{color:var(--text3);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:12px;padding:0;}
.bc-link:hover{color:var(--accent);}
.bc-sep{color:var(--text3);}
.bc-cur{color:var(--text2);}
.vhdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.vhdr-l h2{font-size:22px;font-weight:600;}
.vhdr-l p{font-size:13px;color:var(--text2);margin-top:3px;}
.vfilters{display:flex;gap:8px;flex-wrap:wrap;}
.fsel{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 12px;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;}
.fsel:focus{border-color:var(--accent);}
.fsel option{background:var(--bg3);}
.itabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.itab{background:transparent;border:1px solid var(--border);color:var(--text2);padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.itab:hover{border-color:var(--border2);color:var(--text);}
.itab.active{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:500;}
/* METRIC TILES */
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:18px;}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.mc-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px;}
.mc-val{font-size:23px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);line-height:1;}
.mc-sub{font-size:11px;color:var(--text2);margin-top:4px;}
.mc-val.r{color:var(--red);}
.mc-val.g{color:var(--green);}
/* CALC BANNER */
.cbanner{background:rgba(79,156,249,0.08);border:1px solid rgba(79,156,249,0.2);border-radius:10px;padding:10px 16px;margin-bottom:14px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;}
/* AI */
.aipanel{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:20px 22px;margin-bottom:18px;position:relative;overflow:hidden;}
.aipanel::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent2),var(--purple),var(--teal));}
.aitop{display:flex;align-items:center;gap:9px;}
.aibadge{background:linear-gradient(135deg,var(--accent2),var(--purple));color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;}
.aititle{font-size:14px;font-weight:600;flex:1;}
.aibtn{background:var(--accent2);color:#fff;border:none;padding:8px 18px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;}
.aibtn:hover{background:#2563eb;}
.aibtn:disabled{opacity:.55;cursor:default;}
.aibody{margin-top:14px;}
.aiph{color:var(--text3);font-size:13px;font-style:italic;}
.aicards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;}
.aicard{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:14px 16px;}
.aicard.good{border-color:rgba(52,211,153,.22);}
.aicard.warn{border-color:rgba(251,191,36,.22);}
.aicard.info{border-color:rgba(79,156,249,.18);}
.aicard-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.aidot{width:7px;height:7px;border-radius:50%;}
.aidot.good{background:var(--green);}
.aidot.warn{background:var(--amber);}
.aidot.info{background:var(--accent);}
.aitype{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.aitype.good{color:var(--green);}
.aitype.warn{color:var(--amber);}
.aitype.info{color:var(--accent);}
.aitext{font-size:13px;color:var(--text2);line-height:1.65;}
.ailoading{display:flex;align-items:center;gap:9px;color:var(--text2);font-size:13px;}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* TABLE */
.tsec{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.thdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.thdr-t{font-size:13px;font-weight:500;color:var(--text2);}
.tleg{display:flex;gap:14px;font-size:11px;color:var(--text3);}
.tleg-i{display:flex;align-items:center;gap:4px;}
.tleg-d{width:7px;height:7px;border-radius:2px;}
.twrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:var(--bg3);font-size:10px;font-weight:600;color:var(--text3);padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em;user-select:none;}
th:first-child{text-align:left;min-width:150px;position:sticky;left:0;background:var(--bg3);z-index:2;}
th.sortable{cursor:pointer;transition:color .15s;}
th.sortable:hover{color:var(--accent);}
th.sort-asc::after{content:' ↑';color:var(--accent);}
th.sort-desc::after{content:' ↓';color:var(--accent);}
th.ynew{border-left:2px solid rgba(79,156,249,.25);}
td{padding:7px 10px;text-align:right;border-top:1px solid var(--border);color:var(--text);white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px;}
td:first-child{text-align:left;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;position:sticky;left:0;background:var(--bg2);z-index:1;}
tr:hover td{background:var(--bg3)!important;}
td.ynew{border-left:2px solid rgba(79,156,249,.15);}
td.hi{color:var(--red)!important;}
td.lo{color:var(--green)!important;}
td.mt{color:var(--text3);}
.tfoot td{background:var(--bg3)!important;font-weight:600;border-top:1px solid var(--border2);color:var(--text)!important;}
.tfoot td:first-child{font-family:'DM Sans',sans-serif;}
.nodata{padding:44px;text-align:center;color:var(--text3);font-size:14px;}
/* SCORECARD */
.sc-title{font-size:26px;font-weight:600;margin-bottom:4px;}
.sc-sub{font-size:14px;color:var(--text2);margin-bottom:26px;}
.sc-sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
.sc-sec{margin-bottom:26px;}
.sc-sec-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:11px;display:flex;align-items:center;gap:8px;}
.sc-badge{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--bg3);color:var(--text3);font-weight:500;text-transform:none;letter-spacing:0;}
.sc-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.sct{width:100%;border-collapse:collapse;}
.sct th{background:var(--bg3);font-size:10px;font-weight:600;color:var(--text3);padding:9px 13px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em;}
.sct th:first-child{text-align:left;min-width:210px;position:sticky;left:0;background:var(--bg3);z-index:2;}
.sct td{padding:9px 13px;text-align:right;border-top:1px solid var(--border);font-family:'DM Mono',monospace;font-size:13px;color:var(--text);white-space:nowrap;}
.sct td:first-child{text-align:left;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;position:sticky;left:0;background:var(--bg2);z-index:1;}
.sct tr:hover td{background:var(--bg3)!important;}
.sct .stotal td{background:var(--bg3)!important;font-weight:700;border-top:2px solid var(--border2);}
.sct .stotal td:first-child{font-family:'DM Sans',sans-serif;}
.sct td.sl{border-left:1px solid var(--border2);}
.tpill{font-size:9px;color:var(--text3);background:var(--bg4);padding:1px 5px;border-radius:4px;margin-left:5px;font-family:'DM Sans',sans-serif;}
.vg{color:var(--green)!important;}
.vr{color:var(--red)!important;}
.vn{color:var(--text2)!important;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadein .22s ease forwards;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo">TV</div>
    <div><div class="brand-title">Initiative Dashboard</div><div class="brand-sub">Techvestor · Cost Tracking</div></div>
  </div>
  <div class="pill"><div class="pill-dot"></div><span id="pill-txt">149 properties · 17 initiatives</span></div>
</div>

<div class="fbar">

    <button class="ntab active" id="nt-home" onclick="switchTab('home')">📊 Initiatives</button>
    <button class="ntab" id="nt-sc" onclick="switchTab('sc')">🎯 Progress Scorecard</button>
  </div>
  <div class="fbar-right">
    <select class="mkt-sel" id="mkt-sel" onchange="setMarket(this.value)">
      <option value="">All Markets</option>
      <option value="Blue Ridge, GA">Blue Ridge, GA</option>
      <option value="Branson, MO">Branson, MO</option>
      <option value="Clearwater, FL">Clearwater, FL</option>
      <option value="Eldred, NY">Eldred, NY</option>
      <option value="Galena, IL">Galena, IL</option>
      <option value="McGaheysville, VA">McGaheysville, VA</option>
      <option value="Memphis, TN">Memphis, TN</option>
      <option value="Panama City Beach, FL">Panama City Beach, FL</option>
      <option value="Poconos, PA">Poconos, PA</option>
      <option value="Scottsdale, AZ">Scottsdale, AZ</option>
      <option value="West Palm Beach, FL">West Palm Beach, FL</option>
    </select>
    <div class="fbtns">
      <button class="fbtn active" id="fb-0" onclick="setFund(0)">All Funds</button>
      <button class="fbtn" id="fb-1" onclick="setFund(1)">Fund 1</button>
      <button class="fbtn" id="fb-2" onclick="setFund(2)">Fund 2</button>
      <button class="fbtn" id="fb-3" onclick="setFund(3)">Fund 3</button>
    </div>
  </div>
</div>

<div class="main" id="main"></div>

  if(tab==='home'){ if(curView.gid) renderGroup(curView.gid,curView.init,curView.yr); else renderHome(); }
  else renderSC();
}

// ── CORE CALCULATIONS ─────────────────────────────────────────────
// All calcs operate on already-filtered props list

function mtTotals(initKey, props){
  // monthly totals for given props
  const d=D[initKey];if(!d||!props.length)return{};
  const mt={};
  for(const m of d.months){
    mt[m]=props.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);
  }
  return mt;
}

function mtTotalsPT(initKey, props){
  // per-turn monthly totals: total spend / total checkouts
  const d=D[initKey];if(!d||!props.length)return{};
  const mt={};
  for(const m of d.months){
    const spend=props.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);
    const cts=getCheckouts(props,m);
    mt[m]=cts>0?spend/cts:0;
  }
  return mt;
}

function calcMetrics(initKey){
  const d=D[initKey];if(!d)return null;
  const props=fprops(initKey);
  if(!props.length)return null;
  const months=d.months;
  const mt=isPT(initKey)?mtTotalsPT(initKey,props):mtTotals(initKey,props);

  const lastMo=months[months.length-1];
  const lastMoSpend=props.reduce((s,p)=>s+(d.data[p+'|'+lastMo]||0),0);
  const lastMoCts=getCheckouts(props,lastMo);
  const lastMoCPT=lastMoCts>0?lastMoSpend/lastMoCts:0;
  const lastMoVal=isPT(initKey)?lastMoCPT:(mt[lastMo]||0);

  // Last quarter = last 3 months avg
  const lqMonths=months.slice(-3);
  const lqVals=lqMonths.map(m=>mt[m]||0);
  const lqAvg=lqVals.length?lqVals.reduce((s,v)=>s+v,0)/lqVals.length:0;

  // T-12 = trailing 12 months avg
  const t12Months=months.slice(-12);
  const t12Vals=t12Months.map(m=>mt[m]||0);
  const t12Avg=t12Vals.length?t12Vals.reduce((s,v)=>s+v,0)/t12Vals.length:0;

  // Trend: last month vs prior 3-month avg
  const priorMonths=months.slice(-4,-1);
  const priorAvg=priorMonths.length?priorMonths.map(m=>mt[m]||0).reduce((s,v)=>s+v,0)/priorMonths.length:0;
  const trendPct=priorAvg?((lastMoVal-priorAvg)/priorAvg)*100:0;

  // Grand total (raw spend)
  let grand=0;
  for(const m of months)grand+=props.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);

  return{
    props, months, mt, lastMo, lastMoVal, lastMoSpend, lastMoCts, lastMoCPT,
    lqAvg, t12Avg, trendPct, grand,
    avgMonthly: grand/(months.length||1)
  };
}

// ── SCORECARD ─────────────────────────────────────────────────────
function renderSC(){
  // Fund 3 has no initiatives → show message
  if(fund===3){
    $('main').innerHTML=`<div class="fi" style="padding:60px;text-align:center;color:var(--text3)">
      <div style="font-size:48px;margin-bottom:16px">🏗️</div>
      <div style="font-size:18px;font-weight:600;color:var(--text2);margin-bottom:8px">No Scorecard for Fund 3</div>
      <div style="font-size:14px">Fund 3 properties are tracked within the Initiatives view but do not yet have separate scorecard goals configured.</div>
    </div>`;
    return;
  }

  const cfgRows = fund===2 ? SC.fund2 : SC.fund1;
  const fundLabel = fund===2?'Fund 2':fund===1?'Fund 1':'All Funds (showing Fund 1 + Fund 2 combined)';
  const lm = latestMonth();

  // Calculate live metrics for each SC row using QB data
  const rows = cfgRows.map(r=>{
    const initKey = SC_MAP[r.name];
    const d = D[initKey];
    if(!d) return {...r, t12Metric:0,lqMetric:0,lmMetric:0, t12Month:0,lqMonth:0,lmMonth:0, savT12:0,savLQ:0,savLM:0};

    // Filter props by fund (if fund filter active)
    const props = fund ? d.properties.filter(p=>(d.propFunds||{})[p]===fund) : d.properties;
    if(!props.length) return {...r, t12Metric:0,lqMetric:0,lmMetric:0, t12Month:0,lqMonth:0,lmMonth:0, savT12:0,savLQ:0,savLM:0};

    const months = d.months;
    const isPerTurn = d.isPerTurn;
    const nProps = props.length;

    // Monthly totals per metric type
    function metricVal(m){
      const spend=props.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);
      if(isPerTurn){const cts=getCheckouts(props,m);return cts>0?spend/cts:0;}
      const typeL=(r.metricType||'').toLowerCase();
      if(typeL.includes('month')&&!typeL.includes('prop'))return spend; // flat total
      return nProps>0?spend/nProps:0; // per property
    }

    function monthTotal(m){
      return props.reduce((s,p)=>s+(d.data[p+'|'+m]||0),0);
    }

    // T-12
    const t12Ms=months.slice(-12);
    const t12MetricAvg=t12Ms.length?t12Ms.map(metricVal).reduce((s,v)=>s+v,0)/t12Ms.length:0;
    const t12MonthAvg=t12Ms.length?t12Ms.map(monthTotal).reduce((s,v)=>s+v,0)/t12Ms.length:0;

    // Last quarter (last 3 months)
    const lqMs=months.slice(-3);
    const lqMetricAvg=lqMs.length?lqMs.map(metricVal).reduce((s,v)=>s+v,0)/lqMs.length:0;
    const lqMonthAvg=lqMs.length?lqMs.map(monthTotal).reduce((s,v)=>s+v,0)/lqMs.length:0;

    // Last month
    const lastM=months[months.length-1];
    const lmMetric=lastM?metricVal(lastM):0;
    const lmMonth=lastM?monthTotal(lastM):0;

    // Savings = goalMonth - actualMonth  (positive = saving)
    return {
      ...r,
      t12Metric:t12MetricAvg, lqMetric:lqMetricAvg, lmMetric,
      t12Month:t12MonthAvg, lqMonth:lqMonthAvg, lmMonth,
      savT12: r.goalMonth - t12MonthAvg,
      savLQ:  r.goalMonth - lqMonthAvg,
      savLM:  r.goalMonth - lmMonth,
    };
  });

  // Summary totals
  const tot={sg:0,st12:0,slq:0,slm:0,pmPre:0,pmGoal:0,pmT12:0,pmLQ:0,pmLM:0};
  for(const r of rows){
    tot.sg+=r.savingsGoal||0; tot.st12+=r.savT12||0; tot.slq+=r.savLQ||0; tot.slm+=r.savLM||0;
    tot.pmPre+=r.preMonth||0; tot.pmGoal+=r.goalMonth||0;
    tot.pmT12+=r.t12Month||0; tot.pmLQ+=r.lqMonth||0; tot.pmLM+=r.lmMonth||0;
  }

  const tl=t=>{if(!t||t==='nan')return'$/prop/mo';const l=t.toLowerCase();if(l.includes('turn'))return'$/turn';if(l.includes('month')&&!l.includes('prop'))return'$/mo';return'$/prop/mo';};

  let h=`<div class="fi">
    <div class="sc-title">🎯 Progress Scorecard</div>
    <div class="sc-sub">Initiative performance vs baseline and goals · ${lm?ml(lm):''} · <strong style="color:var(--accent)">${fundLabel}</strong></div>
    <div class="sc-sgrid">
      <div class="scard"><div class="scard-lbl">Goal Monthly Savings</div><div class="scard-val" style="color:${tot.sg>0?'var(--green)':'var(--red)'}">${fmtSav(tot.sg)}</div><div class="scard-sub">vs pre-initiative baseline</div></div>
      <div class="scard"><div class="scard-lbl">T-12 vs Goal</div><div class="scard-val" style="color:${tot.st12>0?'var(--green)':'var(--red)'}">${fmtSav(tot.st12)}</div><div class="scard-sub">trailing 12-mo avg</div></div>
      <div class="scard"><div class="scard-lbl">Last Quarter vs Goal</div><div class="scard-val" style="color:${tot.slq>0?'var(--green)':'var(--red)'}">${fmtSav(tot.slq)}</div><div class="scard-sub">last 3-month avg</div></div>
      <div class="scard"><div class="scard-lbl">Last Month vs Goal</div><div class="scard-val" style="color:${tot.slm>0?'var(--green)':'var(--red)'}">${fmtSav(tot.slm)}</div><div class="scard-sub">${lm?ml(lm):''}</div></div>
      <div class="scard"><div class="scard-lbl">Beating Goal</div><div class="scard-val" style="color:var(--green)">${rows.filter(r=>r.savLM>0).length}</div><div class="scard-sub">of ${rows.length} last month</div></div>
    </div>

    <div class="sc-sec">
      <div class="sc-sec-title">Average $ Per Metric <span class="sc-badge">Per-property/month or per-turn · ${fundLabel}</span></div>
      <div class="sc-wrap"><div class="twrap"><table class="sct"><thead><tr>
        <th>Initiative</th><th style="color:var(--text2)">Pre-Initiative</th><th style="color:var(--accent)">Goal</th>
        <th class="sl">T-12 Avg</th><th>Last Quarter</th><th>Last Month</th><th>vs Goal</th>
      </tr></thead><tbody>`;

  for(const r of rows){
    const vg=r.lmMetric-r.goal;
    const vgFmt=vg>0?`<span class="vr">+${fmtF(vg)}</span>`:`<span class="vg">-${fmtF(Math.abs(vg))}</span>`;
    h+=`<tr><td>${r.name}<span class="tpill">${tl(r.metricType)}</span></td>
      <td style="color:var(--text2)">${fmtF(r.pre)}</td><td style="color:var(--accent)">${fmtF(r.goal)}</td>
      <td class="sl">${fmtF(r.t12Metric)}</td><td>${fmtF(r.lqMetric)}</td><td>${fmtF(r.lmMetric)}</td>
      <td>${vgFmt}</td></tr>`;
  }
  h+=`</tbody></table></div></div></div>

    <div class="sc-sec">
      <div class="sc-sec-title">Average $ Per Month <span class="sc-badge">Total monthly spend · ${fundLabel}</span></div>
      <div class="sc-wrap"><div class="twrap"><table class="sct"><thead><tr>
        <th>Initiative</th><th style="color:var(--text2)">Pre-Initiative</th><th style="color:var(--accent)">Goal</th>
        <th class="sl">T-12 Avg</th><th>Last Quarter</th><th>Last Month</th>
      </tr></thead><tbody>`;

  let tPre=0,tGoal=0,tT12=0,tLQ=0,tLM=0;
  for(const r of rows){
    tPre+=r.preMonth;tGoal+=r.goalMonth;tT12+=r.t12Month;tLQ+=r.lqMonth;tLM+=r.lmMonth;
    h+=`<tr><td>${r.name}</td>
      <td style="color:var(--text2)">${fmtF(r.preMonth)}</td><td style="color:var(--accent)">${fmtF(r.goalMonth)}</td>
      <td class="sl ${r.t12Month<=r.goalMonth?'vg':''}">${fmtF(r.t12Month)}</td>
      <td class="${r.lqMonth<=r.goalMonth?'vg':''}">${fmtF(r.lqMonth)}</td>
      <td class="${r.lmMonth<=r.goalMonth?'vg':'vr'}">${fmtF(r.lmMonth)}</td></tr>`;
  }
  h+=`<tr class="stotal"><td>Totals</td>
    <td style="color:var(--text2)">${fmtF(tPre)}</td><td style="color:var(--accent)">${fmtF(tGoal)}</td>
    <td class="sl">${fmtF(tT12)}</td><td>${fmtF(tLQ)}</td><td>${fmtF(tLM)}</td>
  </tr></tbody></table></div></div></div>

    <div class="sc-sec">
      <div class="sc-sec-title">Savings Per Month <span class="sc-badge">Goal minus actual · green = saving · red = over goal · ${fundLabel}</span></div>
      <div class="sc-wrap"><div class="twrap"><table class="sct"><thead><tr>
        <th>Initiative</th><th style="color:var(--accent)">Goal Savings</th>
        <th class="sl">T-12</th><th>Last Quarter</th><th>Last Month</th>
      </tr></thead><tbody>`;

  for(const r of rows){
    h+=`<tr><td>${r.name}</td>
      <td class="${sc(r.savingsGoal)}">${fmtSav(r.savingsGoal)}</td>
      <td class="sl ${sc(r.savT12)}">${fmtSav(r.savT12)}</td>
      <td class="${sc(r.savLQ)}">${fmtSav(r.savLQ)}</td>
      <td class="${sc(r.savLM)}">${fmtSav(r.savLM)}</td></tr>`;
  }
  h+=`<tr class="stotal"><td>Totals</td>
    <td class="${sc(tot.sg)}">${fmtSav(tot.sg)}</td>
    <td class="sl ${sc(tot.st12)}">${fmtSav(tot.st12)}</td>
    <td class="${sc(tot.slq)}">${fmtSav(tot.slq)}</td>
    <td class="${sc(tot.slm)}">${fmtSav(tot.slm)}</td>
  </tr></tbody></table></div></div></div>
  </div>`;

  $('main').innerHTML=h;
}

// ── HOME ──────────────────────────────────────────────────────────
function renderHome(){
  curView={gid:null,init:null,mkt:'all',yr:''};
  const lm=latestMonth();
  let lmTotal=0, lqTotal=0, allProps=new Set(), allMkts=new Set();
  let allTime=0;

  for(const g of GROUPS)for(const k of g.inits){
    const d=D[k];if(!d)continue;
    const props=fprops(k);
    props.forEach(p=>{allProps.add(p);const m=PI[p]?.market;if(m)allMkts.add(m);});
    lmTotal+=props.reduce((s,p)=>s+(d.data[p+'|'+lm]||0),0);
    const lqMos=d.months.slice(-3);lqTotal+=lqMos.reduce((s,mo)=>s+props.reduce((ps,p)=>ps+(d.data[p+'|'+mo]||0),0),0)/Math.max(lqMos.length,1);
    for(const mo of d.months)for(const p of props)allTime+=(d.data[p+'|'+mo]||0);
  }
  const fLbl=fund?` · Fund ${fund}`:'';

  let h=`<div class="fi">
    <div class="page-title">Cost Initiative Dashboard</div>
    <div class="page-sub">Monthly spend${fLbl} · ${lm?ml(lm):''}</div>
    <div class="sgrid">
      <div class="scard"><div class="scard-lbl">Last Month Spend</div><div class="scard-val">${fmt(lmTotal)}</div><div class="scard-sub">${lm?ml(lm):''}</div><div class="scard-sub2">${fmt(allTime)} all time</div></div>
      <div class="scard"><div class="scard-lbl">Properties</div><div class="scard-val">${allProps.size}</div><div class="scard-sub">${fund?'Fund '+fund:'All funds'}</div></div>
      <div class="scard"><div class="scard-lbl">Initiatives</div><div class="scard-val">${GROUPS.reduce((s,g)=>s+g.inits.filter(k=>D[k]).length,0)}</div><div class="scard-sub">${GROUPS.length} groups</div></div>
      <div class="scard"><div class="scard-lbl">Last Quarter Avg</div><div class="scard-val">${fmt(lqTotal)}</div><div class="scard-sub">last 3 months</div></div>
    </div>
    <div class="glabel">Initiative Groups — click to explore</div>
    <div class="ggrid">`;

  for(const g of GROUPS){
    let grpLM=0,grpAT=0; const grpProps=new Set();
    const irows=[];let imp=0,att=0;
    for(const k of g.inits){
      const d=D[k];if(!d)continue;
      const props=fprops(k);
      if(!props.length)continue;
      props.forEach(p=>grpProps.add(p));
      const lmSpend=props.reduce((s,p)=>s+(d.data[p+'|'+lm]||0),0);
      grpLM+=lmSpend;
      for(const mo of d.months)for(const p of props)grpAT+=(d.data[p+'|'+mo]||0);
      // trend
      const mt={};for(const mo of d.months)mt[mo]=props.reduce((s,p)=>s+(d.data[p+'|'+mo]||0),0);
      const prior=d.months.slice(-4,-1);
      const priorAvg=prior.length?prior.map(m=>mt[m]||0).reduce((s,v)=>s+v,0)/prior.length:0;
      const pct=priorAvg?((mt[lm]||0)-priorAvg)/priorAvg*100:0;
      if(pct<-5)imp++;else if(pct>10)att++;
      irows.push({nm:k.replace(/_/g,' '),v:lmSpend,pct});
    }
    if(!grpProps.size)continue;
    const n=irows.length;
    const [pc,pl]=att===0?['gpill-g',imp>0?`↓ ${imp} of ${n} improving`:'✓ All stable']:att===n?['gpill-r',`↑ ${att} need attention`]:['gpill-a',`${imp} improving · ${att} flagged`];
    const ap=irows.length?irows.reduce((s,r)=>s+r.pct,0)/irows.length:0;
    const [tc,tl]=ap<-5?['gtrend-d',`↓ ${Math.abs(ap).toFixed(1)}%`]:ap>10?['gtrend-u',`↑ ${ap.toFixed(1)}%`]:['gtrend-f','→ Stable'];
    h+=`<div class="gcard" onclick="renderGroup('${g.id}')">
      <div class="gcard-bar" style="background:${g.col}"></div>
      <div class="gcard-top"><div class="gcard-icon">${g.ic}</div><div class="gpill ${pc}">${pl}</div></div>
      <div class="gcard-name">${g.nm}</div>
      <div class="gcard-mrow"><div class="gcard-spend">${fmt(grpLM)}</div><div class="gtrend ${tc}">${tl}</div></div>
      <div class="gcard-meta">${lm?ml(lm):''} · ${grpProps.size} properties</div>
      <div class="gcard-at">All time: ${fmt(grpAT)}</div>
      <div class="ilist">`;
    for(const r of irows){
      if(!r.v&&!r.pct)continue;
      const [tc2,tl2]=r.pct<-5?['itrend-d',`↓ ${Math.abs(r.pct).toFixed(1)}%`]:r.pct>10?['itrend-u',`↑ ${r.pct.toFixed(1)}%`]:['itrend-f','→ Stable'];
      h+=`<div class="irow"><span class="irow-n">${r.nm}</span><div class="irow-r"><span class="irow-v">${fmt(r.v)}</span><span class="itrend ${tc2}">${tl2}</span></div></div>`;
    }
    h+=`</div></div>`;
  }
  h+=`</div></div>`;
  $('main').innerHTML=h;
}

// ── GROUP / INITIATIVE VIEW ────────────────────────────────────────
function renderGroup(gid,initKey,yr){
  const g=GROUPS.find(x=>x.id===gid);if(!g)return;
  const ak=initKey||g.inits[0];
  const sy=(yr===undefined||yr===null)?'':yr;
  curView={gid,init:ak,yr:sy};

  const d=D[ak]||{months:[],properties:[],markets:[],data:{}};
  const lm=latestMonth();
  const allYrs=[...new Set(d.months.map(m=>m.split('-')[0]))].sort();
  const props=fprops(ak);
  const mkts=[...new Set(d.markets)].sort();
  const perTurn=isPT(ak);

  // Apply year filter
  const months=sy?d.months.filter(m=>m.startsWith(sy)):d.months;

  // Monthly totals
  const mt={};
  for(const mo of months)mt[mo]=props.reduce((s,p)=>s+(d.data[p+'|'+mo]||0),0);

  // Per-turn display values
  const ptMt={};
  if(perTurn){
    for(const mo of months){const spend=mt[mo]||0;const cts=getCheckouts(props,mo);ptMt[mo]=cts>0?spend/cts:0;}
  }
  const dispMt=perTurn?ptMt:mt;

  // Prop display values
  const propDisp={};
  for(const p of props)for(const mo of months){
    const spend=d.data[p+'|'+mo]||0;
    if(perTurn){const cts=CO[p]?.[mo]||0;propDisp[p+'|'+mo]=cts>0?spend/cts:0;}
    else propDisp[p+'|'+mo]=spend;
  }

  // Sorting
  const sortedProps=[...props];
  if(sortSt.col==='name')sortedProps.sort((a,b)=>sortSt.dir==='asc'?a.localeCompare(b):b.localeCompare(a));
  else if(sortSt.col==='total')sortedProps.sort((a,b)=>{
    const ta=months.reduce((s,mo)=>s+(propDisp[a+'|'+mo]||0),0);
    const tb=months.reduce((s,mo)=>s+(propDisp[b+'|'+mo]||0),0);
    return sortSt.dir==='asc'?ta-tb:tb-ta;
  });
  else sortedProps.sort((a,b)=>{
    const va=propDisp[a+'|'+sortSt.col]||0,vb=propDisp[b+'|'+sortSt.col]||0;
    return sortSt.dir==='asc'?va-vb:vb-va;
  });

  // Highlight thresholds
  const allV=sortedProps.flatMap(p=>months.map(mo=>propDisp[p+'|'+mo]||0)).filter(v=>v>0).sort((a,b)=>a-b);
  const p75=allV[Math.floor(allV.length*.75)]||Infinity;
  const p25=allV[Math.floor(allV.length*.25)]||0;

  // Metric tiles
  const lastMoStr=months[months.length-1]||'';
  const lastMoSpend=mt[lastMoStr]||0;
  const lastMoCts=perTurn?getCheckouts(props,lastMoStr):0;
  const lastMoCPT=perTurn&&lastMoCts>0?lastMoSpend/lastMoCts:0;
  const lastMoVal=perTurn?lastMoCPT:lastMoSpend;

  // T-12 avg
  const t12Ms=months.slice(-12);
  const t12Val=t12Ms.length?t12Ms.map(mo=>dispMt[mo]||0).reduce((s,v)=>s+v,0)/t12Ms.length:0;

  // Last quarter avg (last 3 months)
  const lqMs=months.slice(-3);
  const lqVal=lqMs.length?lqMs.map(mo=>dispMt[mo]||0).reduce((s,v)=>s+v,0)/lqMs.length:0;

  // Trend
  const priorMs=months.slice(-4,-1);
  const priorAvg=priorMs.length?priorMs.map(mo=>dispMt[mo]||0).reduce((s,v)=>s+v,0)/priorMs.length:0;
  const trendPct=priorAvg?((lastMoVal-priorAvg)/priorAvg)*100:0;
  const tc=trendPct>10?'r':trendPct<-5?'g':'';

  let grand=0;for(const mo of months)grand+=mt[mo]||0;
  const fLbl=fund?` · Fund ${fund}`:'';
  const cacheKey=ak+'|'+mkt+'|'+sy+'|'+fund;
  const ai=aiCache[cacheKey]||{};

  let h=`<div class="fi">
    <div class="bc"><button class="bc-link" onclick="renderHome()">Dashboard</button><span class="bc-sep">›</span><span class="bc-cur">${g.nm}</span></div>
    <div class="vhdr">
      <div class="vhdr-l"><h2>${g.ic} ${g.nm}</h2><p>${g.inits.length} initiatives${fLbl}${mkt?' · '+mkt:' · '+mkts.slice(0,3).join(', ')+(mkts.length>3?' + more':'')}</p></div>
      <div class="vfilters">
        <select class="fsel" onchange="renderGroup('${gid}','${ak}',this.value)">
          <option value="" ${!sy?'selected':''}>All years</option>
          ${allYrs.map(y=>`<option value="${y}" ${sy===y?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="itabs">${g.inits.map(k=>`<button class="itab ${k===ak?'active':''}" onclick="renderGroup('${gid}','${k}','${sy}')">${k.replace(/_/g,' ')}</button>`).join('')}</div>
    <div class="mrow">
      <div class="mc"><div class="mc-lbl">Last Month${perTurn?' ($/Turn)':''}</div><div class="mc-val">${fmtF(lastMoVal)}</div><div class="mc-sub">${lastMoStr?ml(lastMoStr):''}</div></div>
      ${perTurn?`<div class="mc"><div class="mc-lbl">Checkouts</div><div class="mc-val">${lastMoCts}</div><div class="mc-sub">${lastMoStr?ml(lastMoStr):''}</div></div>`:''}
      <div class="mc"><div class="mc-lbl">Last Quarter Avg</div><div class="mc-val">${fmtF(lqVal)}</div><div class="mc-sub">last 3 months</div></div>
      <div class="mc"><div class="mc-lbl">T-12 Avg</div><div class="mc-val">${fmtF(t12Val)}</div><div class="mc-sub">trailing 12 months</div></div>
      <div class="mc"><div class="mc-lbl">Monthly Trend</div><div class="mc-val ${tc}">${trendPct>=0?'+':''}${trendPct.toFixed(1)}%</div><div class="mc-sub">vs prior 3-mo avg</div></div>
      <div class="mc"><div class="mc-lbl">Properties</div><div class="mc-val">${props.length}</div><div class="mc-sub">${fund?'Fund '+fund:'All funds'}</div></div>
    </div>
    ${perTurn?`<div class="cbanner">💡 <span><strong>Cost per checkout (turn)</strong> — each cell = total spend ÷ checkouts for that property/month. Red/green based on cost-per-turn.</span></div>`:''}
    <div class="aipanel">
      <div class="aitop">
        <span class="aibadge">AI Analysis</span>
        <span class="aititle">${ak.replace(/_/g,' ')} — Spending Insights</span>
        <button class="aibtn" onclick="runAI('${gid}','${ak}','${sy}')" ${ai.loading?'disabled':''}>
          ${ai.loading?'<span class="spinner"></span> Analyzing...':ai.insights?'↻ Re-analyze':'✦ Analyze Initiative'}
        </button>
      </div>
      <div class="aibody">
        ${ai.loading?`<div class="ailoading"><div class="spinner"></div>Analyzing ${props.length} properties...</div>`
          :ai.insights?renderInsights(ai.insights)
          :ai.error?`<div style="color:var(--red);font-size:13px">${ai.error}</div>`
          :'<div class="aiph">Click "Analyze Initiative" for AI-powered insights.</div>'}
      </div>
    </div>`;

  if(!months.length||!props.length){
    h+=`<div class="tsec"><div class="nodata">No data found for this initiative with the current filters.</div></div>`;
  } else {
    h+=`<div class="tsec">
      <div class="thdr">
        <span class="thdr-t">${props.length} properties · ${months.length} months${perTurn?' · values = cost per checkout':''} · click headers to sort</span>
        <div class="tleg"><div class="tleg-i"><div class="tleg-d" style="background:var(--red)"></div>Top 25%</div><div class="tleg-i"><div class="tleg-d" style="background:var(--green)"></div>Bottom 25%</div></div>
      </div>
      <div class="twrap"><table><thead><tr>
      <th class="sortable" onclick="ss('name')" style="text-align:left">Property${sortSt.col==='name'?' class="sort-'+sortSt.dir+'"':''}</th>`;
    let py=null;
    for(const mo of months){
      const y=mo.split('-')[0];const ny=y!==py;
      const isc=sortSt.col===mo;
      h+=`<th class="sortable${ny?' ynew':''}${isc?' sort-'+sortSt.dir:''}" onclick="ss('${mo}')">${ny?y+' ':''}${ms(mo)}</th>`;
      py=y;
    }
    h+=`<th class="sortable${sortSt.col==='total'?' sort-'+sortSt.dir:''}" onclick="ss('total')">${perTurn?'Avg $/Turn':'Total'}</th></tr></thead><tbody>`;

    for(const p of sortedProps){
      const nonZero=months.map(mo=>propDisp[p+'|'+mo]||0).filter(v=>v>0);
      const rowSumm=perTurn?(nonZero.length?nonZero.reduce((s,v)=>s+v,0)/nonZero.length:0):months.reduce((s,mo)=>s+(d.data[p+'|'+mo]||0),0);
      h+=`<tr><td>${p}</td>`;
      let py2=null;
      for(const mo of months){
        const v=propDisp[p+'|'+mo]||0;
        const y=mo.split('-')[0];const ny=y!==py2;
        const cls=v>=p75&&v>0?'hi':v>0&&v<=p25?'lo':v===0?'mt':'';
        h+=`<td class="${cls}${ny?' ynew':''}">${v>0?fmtF(v):'—'}</td>`;
        py2=y;
      }
      h+=`<td>${rowSumm>0?fmtF(rowSumm):'—'}</td></tr>`;
    }
    h+=`<tr class="tfoot"><td>${perTurn?'Portfolio Avg':'Total'}</td>`;
    let py3=null;
    for(const mo of months){
      const y=mo.split('-')[0];const ny=y!==py3;
      h+=`<td class="${ny?'ynew':''}">${(dispMt[mo]||0)>0?fmtF(dispMt[mo]):'—'}</td>`;
      py3=y;
    }
    const rowGrand=perTurn?(()=>{const v=months.map(mo=>dispMt[mo]||0).filter(v=>v>0);return v.length?v.reduce((s,v)=>s+v,0)/v.length:0;})():grand;
    h+=`<td>${rowGrand>0?fmtF(rowGrand):'—'}</td></tr></tbody></table></div></div>`;
  }
  h+=`</div>`;
  $('main').innerHTML=h;
  window.scrollTo(0,0);
}

function ss(col){
  sortSt.dir=sortSt.col===col?(sortSt.dir==='desc'?'asc':'desc'):'desc';
  sortSt.col=col;
  renderGroup(curView.gid,curView.init,curView.yr);
}

function renderInsights(ins){
  const tl={good:'On Track',warn:'Needs Attention',info:'Insight'};
  return`<div class="aicards">${ins.map(i=>`<div class="aicard ${i.type}"><div class="aicard-hd"><div class="aidot ${i.type}"></div><span class="aitype ${i.type}">${tl[i.type]}</span></div><div class="aitext">${i.text}</div></div>`).join('')}</div>`;
}

async function runAI(gid,ak,sy){
  const key=ak+'|'+mkt+'|'+sy+'|'+fund;
  aiCache[key]={loading:true};
  renderGroup(gid,ak,sy);
  const d=D[ak];if(!d)return;
  const props=fprops(ak);
  const perTurn=isPT(ak);
  const months=sy?d.months.filter(m=>m.startsWith(sy)):d.months;
  const lm=months[months.length-1]||'';
  const lmSpend=props.reduce((s,p)=>s+(d.data[p+'|'+lm]||0),0);
  const lmCts=perTurn?getCheckouts(props,lm):0;
  const lmCPT=perTurn&&lmCts>0?lmSpend/lmCts:0;
  const mt={};for(const mo of months)mt[mo]=props.reduce((s,p)=>s+(d.data[p+'|'+mo]||0),0);
  const rec=months.slice(-3);
  const pt={};for(const p of props)pt[p]=months.reduce((s,mo)=>s+(d.data[p+'|'+mo]||0),0);
  const sorted=Object.entries(pt).sort((a,b)=>b[1]-a[1]);
  const grand=months.reduce((s,mo)=>s+(mt[mo]||0),0);
  const prompt=`You are a financial analyst for Techvestor STR company. Initiative: "${ak.replace(/_/g,' ')}"${fund?' (Fund '+fund+')':''}.
${perTurn?`Per-turn metric: last month ${fmtF(lmCPT)} per checkout (${lmCts} checkouts).`:''}
- Last month spend: ${fmtF(lmSpend)} (${lm?ml(lm):''})
- All time: ${fmtF(grand)}, monthly avg ${fmtF(grand/(months.length||1))}
- ${props.length} properties tracked
- Top 3 by spend: ${sorted.slice(0,3).map(([p,v])=>p+' ('+fmtF(v)+')').join(', ')}
- Recent: ${rec.map(mo=>ms(mo)+': '+fmtF(mt[mo]||0)).join(', ')}
Give 3 sharp actionable insights. Return ONLY JSON:
{"insights":[{"type":"good","text":"..."},{"type":"warn","text":"..."},{"type":"info","text":"..."}]}`;
  try{
    const r=await fetch(PROXY+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    if(!r.ok)throw new Error('Server '+r.status);
    const dd=await r.json();
    const parsed=JSON.parse((dd.content?.[0]?.text||'').replace(/```json|```/g,'').trim());
    aiCache[key]={insights:parsed.insights};
  }catch(e){aiCache[key]={error:'Analysis unavailable — '+e.message};}
  renderGroup(gid,ak,sy);
}

renderHome();
</script>
</body>
